{% if errors %}
    <ul class="errors">
        {% for error in errors %}
            <li>{{ error }}</li>
        {% endfor %}
    </ul>
{% endif %}

<form method="POST" action="{{ form_action }}">

    <p>
        <label for="title">Название</label><br>
        <input type="text" id="title" name="title" value="{{ form_title }}">
    </p>

    <p>
        <label for="description">Описание</label><br>
        <textarea id="description" name="description" rows="4">{{ form_description }}</textarea>
    </p>

    <p>
        <label for="mood">Настроение (необязательно)</label><br>
        <input type="text" id="mood" name="mood" value="{{ form_mood }}">
    </p>

    <p>
        <label for="image">Изображение</label><br>
        <select id="image" name="image">
            <option value="">- без изображения -</option>
            {% for image in available_images %}
                <option value="{{ image }}" {% if image == form_image %}selected{% endif %}>{{ image }}</option>
            {% endfor %}
        </select>
    </p>

    <p>
        <label for="stream">Стрим Lofi Girl</label><br>
        <select id="stream" name="stream_id">
            <option value="">- без стрима -</option>
            {% for stream in streams %}
                <option value="{{ stream['id'] }}" {% if stream['id'] == form_stream %}selected{% endif %}>{{ stream['title'] }}</option>
            {% endfor %}
        </select>
    </p>

    <button type="submit">{{ button_text }}</button>

</form>
